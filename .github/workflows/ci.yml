name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --locked --all-packages --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Pytest (non-DB)
        run: uv run pytest -m "not requires_db"
