[project]
name = "microcoaching"
version = "0.1.0"
description = "MicroCoaching AI Platform — monorepo root"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "packages/contracts",
    "packages/foundation",
    "services/platform",
    "services/ai-runtime",
    "eval",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "llama-cpp-python-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "llama-cpp-python-metal"
url = "https://abetlen.github.io/llama-cpp-python/whl/metal"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
mc-contracts = { workspace = true }
mc-foundation = { workspace = true }
microcoaching-platform = { workspace = true }
ai-runtime = { workspace = true }
rag-eval = { workspace = true }
llama-cpp-python = [
    { index = "llama-cpp-python-cpu", marker = "sys_platform == 'linux'" },
    { index = "llama-cpp-python-metal", marker = "sys_platform == 'darwin'" },
]
torch = [
    { index = "pytorch-cpu" },
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "services/ai-runtime/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "requires_db: integration test requiring DATABASE_URL_TEST and Postgres",
]

[dependency-groups]
dev = [
    "microcoaching-platform",
    "ai-runtime",
    "rag-eval",
    "pytest>=8.4.2,<9.0.0",
    "pytest-asyncio>=1.2.0,<2.0.0",
    "httpx>=0.28.1,<0.29.0",
    "aiosqlite>=0.20.0",
    "python-dotenv>=1.0.0",
    "ruff>=0.6.0",
    "pre-commit>=4.0.0,<5.0.0",
    "bandit>=1.8.0,<2.0.0",
    "pip-audit>=2.9.0,<3.0.0",
    "pyright>=1.1.400,<2.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5,<10",
]

[tool.coverage.run]
source = ["services/platform/src/platform_service", "services/ai-runtime/src/ai_runtime"]
omit = ["*/tests/*"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = [".venv", "infra/alembic/versions"]

[tool.ruff.lint]
# Baseline rules. Expand to B, SIM, etc. once the fleet is clean.
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade (modern syntax)
    "PLC0415",  # import-outside-top-level
]
ignore = [
    "E501", # line length handled by formatter
    "UP042", # StrEnum migration — stylistic, opt in later
]

[tool.ruff.lint.per-file-ignores]
# Native libs must not load at import time (prompt_executor imports these modules).
"services/ai-runtime/src/ai_runtime/services/local_generation_llama_cpp.py" = ["PLC0415"]
"services/ai-runtime/src/ai_runtime/services/local_embedding.py" = ["PLC0415"]
# importlib.reload requires a post-reload import of the fresh module.
"tests/workers/test_stage_d_draft.py" = ["PLC0415"]
